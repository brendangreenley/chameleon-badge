plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chameleon.badge'
    compileSdk 34

    defaultConfig {
        applicationId "com.chameleon.badge"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
}
